#
# Usage:
#   scp -r . root@<your-server>:~/sajha/
#   ssh root@<your-server>
#   cd ~/sajha && docker compose up -d postgres
#   # SAJHA does not create PostgreSQL tables: run the schema file once (then the seed file:
#   # default roles and admin), then start the rest. docs/getting-started/Database Setup.md
#   # (python -m sajha.db sql prints db/scripts/postgresql/schema.sql from the image; --seed the seed file)
#   docker compose run --rm --no-deps --entrypoint python3 sajha -m sajha.db sql --dialect postgresql \
#     | docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U sajha -d sajha
#   docker compose run --rm --no-deps --entrypoint python3 sajha -m sajha.db sql --dialect postgresql --seed \
#     | docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U sajha -d sajha
#   docker compose up -d
#
version: "3.9"

services:
  sajha:
    image: ghcr.io/ajsinha/sajhamcpserver:latest
    build:
      context: ../../
      dockerfile: deployment/aws/Dockerfile
    container_name: sajha-mcp
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - SAJHA_SERVER_HOST=0.0.0.0
      - SAJHA_SERVER_PORT=3002
      - SAJHA_DB_TYPE=postgresql
      - SAJHA_DB_HOST=postgres
      - SAJHA_DB_PORT=5432
      - SAJHA_DB_NAME=sajha
      - SAJHA_DB_USER=sajha
      - SAJHA_DB_PASSWORD=${DB_PASSWORD:-sajha_secure_2025}
      - SAJHA_DB_SCHEMA_CHECK=strict     # refuse to start while tables or columns are missing (or warn)
      # empty: generated once and kept in the sajha-data volume (data/secrets/)
      - SAJHA_JWT_SECRET=${JWT_SECRET:-}
      # the web session cookie key; empty: generated once into data/secrets/ like the JWT secret
      - SAJHA_AUTH_SESSION_SECRET_KEY=${SESSION_SECRET:-}
      - SAJHA_STORAGE_BACKEND=local
      # Several workers (UVICORN_WORKERS > 1) or several hosts need shared state:
      #   SAJHA_STATE_BACKEND=redis  and  docker compose --profile scale up -d  (starts the redis service)
      #   or SAJHA_STATE_BACKEND=database (uses the postgres service; no extra container)
      # docs/architecture/Scaling and State.md
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - SAJHA_STATE_BACKEND=${SAJHA_STATE_BACKEND:-memory}
      - SAJHA_STATE_REDIS_URL=${SAJHA_STATE_REDIS_URL:-redis://redis:6379/0}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    volumes:
      - sajha-data:/app/data
      - sajha-config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sajha-net

  postgres:
    image: postgres:16-alpine
    container_name: sajha-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sajha
      - POSTGRES_USER=sajha
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sajha_secure_2025}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sajha"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sajha-net

  # Optional shared state store: docker compose --profile scale up -d
  redis:
    image: redis:7-alpine
    container_name: sajha-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sajha-net
    profiles:
      - scale

  caddy:
    image: caddy:2-alpine
    container_name: sajha-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - sajha
    networks:
      - sajha-net

volumes:
  pgdata:
  redisdata:
  sajha-data:
  sajha-config:
  caddy-data:
  caddy-config:

networks:
  sajha-net:
    driver: bridge
