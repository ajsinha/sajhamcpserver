# One pod, SQLite on a ReadWriteOnce volume, in-process state (values-dev.yaml).
#   kubectl create namespace sajha-dev
#   kubectl -n sajha-dev create secret generic sajha-secrets ...   (see ../../README.md)
#   kubectl apply -k deployment/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sajha-dev
resources:
  - ../../base
  - sajha-dev.yaml
