    '
  seed.py: "# Copyright All rights Reserved 2025-2030, Ashutosh Sinha, Email: ajsinha@gmail.com\n\"\"\"\
    SAJHA pod seed step (init container; same image as the server).\n\n1. Copies the image's config/ and\
    \ sajha/tools/impl/ into the writable volumes mounted\n   at /seed/config and /seed/impl.  SEED_MODE=missing\
    \ (default) copies only files the\n   volume does not have, so admin and MCP Studio edits on a persistent\
    \ volume survive;\n   SEED_MODE=overwrite replaces them with the image's copies.\n2. Writes /seed/config/application.yml:\
    \ the image's application.yml with\n   /etc/sajha/overrides.yaml deep-merged in (maps merge; lists\
    \ and scalars replace).\n   Rewritten at every start, so the chart's values are the authority for\
    \ this file.\n3. Waits (WAIT_FOR=\"host:port host:port\", up to WAIT_TIMEOUT seconds) until the bundled\n\
    \   Redis and the PostgreSQL server accept TCP connections: the server refuses to start\n   when a\
    \ shared state store does not answer, and would otherwise restart once.\n\"\"\"\nimport os\nimport\
    \ shutil\nimport socket\nimport sys\nimport time\nfrom pathlib import Path\n\nimport yaml\n\nMODE\
    \ = os.environ.get('SEED_MODE', 'missing')\nIMAGE_CONFIG = Path('/app/config')\nIMAGE_IMPL = Path('/app/sajha/tools/impl')\n\
    OVERRIDES = Path('/etc/sajha/overrides.yaml')\n\n\ndef copy_tree(src: Path, dst: Path) -> int:\n \
    \   n = 0\n    for root, dirs, files in os.walk(src):\n        dirs[:] = [d for d in dirs if d !=\
    \ '__pycache__']\n        target = dst / Path(root).relative_to(src)\n        target.mkdir(parents=True,\
    \ exist_ok=True)\n        for name in files:\n            out = target / name\n            if out.exists()\
    \ and MODE != 'overwrite':\n                continue\n            shutil.copyfile(Path(root) / name,\
    \ out)\n            n += 1\n    return n\n\n\ndef merge(base, extra):\n    for key, value in extra.items():\n\
    \        if isinstance(value, dict) and isinstance(base.get(key), dict):\n            merge(base[key],\
    \ value)\n        else:\n            base[key] = value\n    return base\n\n\ndef wait_for(targets:\
    \ str, timeout: float) -> bool:\n    deadline = time.monotonic() + timeout\n    for target in targets.split():\n\
    \        host, _, port = target.rpartition(':')\n        while True:\n            try:\n         \
    \       socket.create_connection((host, int(port)), timeout=3).close()\n                print(f'seed:\
    \ {target} is accepting connections')\n                break\n            except OSError as e:\n \
    \               if time.monotonic() > deadline:\n                    print(f'seed: {target} still\
    \ unreachable ({e}); starting anyway', file=sys.stderr)\n                    return False\n      \
    \          time.sleep(2)\n    return True\n\n\ndef main() -> int:\n    copied = copy_tree(IMAGE_CONFIG,\
    \ Path('/seed/config'))\n    copied += copy_tree(IMAGE_IMPL, Path('/seed/impl'))\n    base = yaml.safe_load((IMAGE_CONFIG\
    \ / 'application.yml').read_text(encoding='utf-8')) or {}\n    extra = {}\n    if OVERRIDES.exists():\n\
    \        extra = yaml.safe_load(OVERRIDES.read_text(encoding='utf-8')) or {}\n    if not isinstance(extra,\
    \ dict):\n        print('seed: overrides.yaml must be a mapping', file=sys.stderr)\n        return\
    \ 1\n    out = Path('/seed/config/application.yml')\n    tmp = out.with_name('.application.yml.tmp')\n\
    \    tmp.write_text('# Generated at pod start from the image default and the chart\\'s config.overrides.\\\
    n'\n                   '# Edit the Helm values (or the overrides ConfigMap), not this file.\\n'\n\
    \                   + yaml.safe_dump(merge(base, extra), sort_keys=False, allow_unicode=True),\n \
    \                  encoding='utf-8')\n    os.replace(tmp, out)\n    print(f'seed: {copied} file(s)\
    \ copied (mode {MODE}); application.yml merged with '\n          f'{len(extra)} top-level override\
    \ key(s)')\n    wait_for(os.environ.get('WAIT_FOR', ''), float(os.environ.get('WAIT_TIMEOUT', '180')))\n\
    \    return 0\n\n\nif __name__ == '__main__':\n    sys.exit(main())\n"
