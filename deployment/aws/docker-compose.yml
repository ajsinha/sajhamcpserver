# ═══════════════════════════════════════════════════════════════
# SAJHA MCP Server — Local Development with Docker Compose
# Usage: cd deployment/aws && docker compose up --build
# ═══════════════════════════════════════════════════════════════
version: '3.9'

services:
  sajha:
    build:
      context: ../..
      dockerfile: deployment/aws/Dockerfile
    container_name: sajha-mcp-server
    ports:
      - "3002:3002"
    environment:
      # Storage: local filesystem (default for dev)
      SAJHA_STORAGE_BACKEND: local
      SAJHA_BASE_DIR: /app
      # Database: SQLite for dev, PostgreSQL for prod
      SAJHA_DB_TYPE: sqlite
      SAJHA_DB_PATH: /app/data/sajha.db
      # Auth
      JWT_SECRET: ${JWT_SECRET:-}   # empty: generated once into data/secrets/ (sajha-data volume)
      # API Keys (set your own)
      FMP_API_KEY: ${FMP_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      # Server
      SERVER_PORT: 3002
      LOG_LEVEL: INFO
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      # More than one worker: share state (docs/architecture/Scaling and State.md)
      #   UVICORN_WORKERS=4 SAJHA_STATE_BACKEND=redis docker compose --profile scale up --build
      SAJHA_STATE_BACKEND: ${SAJHA_STATE_BACKEND:-memory}
      SAJHA_STATE_REDIS_URL: ${SAJHA_STATE_REDIS_URL:-redis://redis:6379/0}
    volumes:
      # Mount config for live editing during development
      - ../config:/app/config
      - ../sajha/tools/impl:/app/sajha/tools/impl
      - sajha-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Optional: PostgreSQL for production-like testing
  postgres:
    image: postgres:16-alpine
    container_name: sajha-postgres
    environment:
      POSTGRES_DB: sajha
      POSTGRES_USER: sajha
      POSTGRES_PASSWORD: sajha_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    profiles:
      - postgres

  # Optional: Redis as the shared state store (state.backend: redis)
  redis:
    image: redis:7-alpine
    container_name: sajha-redis
    ports:
      - "6379:6379"
    profiles:
      - scale

volumes:
  sajha-data:
  pg-data:
