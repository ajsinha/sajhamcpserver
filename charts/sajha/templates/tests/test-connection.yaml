apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sajha.fullname" . }}-test
  labels:
    {{- include "sajha.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
    sajha-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ include "sajha.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-I", "-c"]
      args:
        - |
          import json, urllib.request
          base = "http://{{ include "sajha.fullname" . }}:{{ .Values.service.port }}"
          h = json.load(urllib.request.urlopen(base + "/health", timeout=10))
          assert h.get("status") == "healthy", h
          print("health:", h.get("version"), "tools", h.get("tools_count"), "state", h.get("state"))
          req = urllib.request.Request(base + "/mcp", method="POST",
              data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
                  "protocolVersion": "2025-11-25", "capabilities": {},
                  "clientInfo": {"name": "helm-test", "version": "1"}}}).encode(),
              headers={"Content-Type": "application/json",
                       "Accept": "application/json, text/event-stream"})
          with urllib.request.urlopen(req, timeout=10) as r:
              print("initialize:", r.status, r.read(200))
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
