{{- if not .Values.secrets.existingSecret }}
{{- $name := include "sajha.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $old "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sajha.labels" . | nindent 4 }}
  annotations:
    # Generated once: losing these signs every user and OAuth client out.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.secrets.keys.jwtSecret }}: {{ get $data .Values.secrets.keys.jwtSecret | default (randAlphaNum 64 | b64enc) }}
  {{ .Values.secrets.keys.sessionSecret }}: {{ get $data .Values.secrets.keys.sessionSecret | default (randAlphaNum 64 | b64enc) }}
  {{ .Values.secrets.keys.oauthSigningKey }}: {{ get $data .Values.secrets.keys.oauthSigningKey | default (genPrivateKey "rsa" | b64enc) }}
  {{ .Values.secrets.keys.metricsToken }}: {{ get $data .Values.secrets.keys.metricsToken | default (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.existingSecret) }}
{{- $rname := include "sajha.redisSecretName" . }}
{{- $rold := (lookup "v1" "Secret" .Release.Namespace $rname) | default dict }}
{{- $rdata := (get $rold "data") | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rname }}
  labels:
    {{- include "sajha.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ get $rdata "redis-password" | default (randAlphaNum 40 | b64enc) }}
{{- end }}
