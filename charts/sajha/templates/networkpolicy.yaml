{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sajha.fullname" . }}
  labels:
    {{- include "sajha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sajha.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- range $np.ingress.namespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        # other SAJHA pods (stream relays do not use HTTP, but federation peers may)
        - podSelector:
            matchLabels:
              {{- include "sajha.selectorLabels" . | nindent 14 }}
        # helm test and any client pod labelled sajha-client: "true" in this namespace
        - podSelector:
            matchLabels:
              sajha-client: "true"
        {{- with $np.ingress.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  egress:
    {{- if $np.egress.dns }}
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    {{- end }}
    {{- if .Values.redis.enabled }}
    - ports:
        - {port: 6379, protocol: TCP}
      to:
        - podSelector:
            matchLabels:
              {{- include "sajha.redisSelectorLabels" . | nindent 14 }}
    {{- end }}
    {{- if eq .Values.database.type "postgresql" }}
    - ports:
        - {port: {{ .Values.database.postgresql.port }}, protocol: TCP}
      {{- with $np.egress.databaseTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- if $np.egress.internet }}
    - ports:
        {{- range $np.egress.internetPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $np.egress.internetExcept | nindent 14 }}
    {{- end }}
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sajha.fullname" . }}-redis
  labels:
    {{- include "sajha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sajha.redisSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 6379, protocol: TCP}
      from:
        - podSelector:
            matchLabels:
              {{- include "sajha.selectorLabels" . | nindent 14 }}
  egress: []
{{- end }}
{{- end }}
