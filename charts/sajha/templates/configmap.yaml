apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sajha.fullname" . }}
  labels:
    {{- include "sajha.labels" . | nindent 4 }}
data:
  {{- $overrides := deepCopy (.Values.config.overrides | default dict) }}
  {{- if .Values.sajhanet.enabled }}
  {{- $net := include "sajha.sajhanetConfig" . | fromYaml }}
  {{- $_ := set $overrides "sajhanet" (merge $net (get $overrides "sajhanet" | default dict)) }}
  {{- end }}
  overrides.yaml: |
    {{- if $overrides }}
    {{- toYaml $overrides | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
  seed.py: |
    {{- .Files.Get "files/seed.py" | nindent 4 }}
