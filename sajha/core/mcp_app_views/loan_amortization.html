Self-contained: no external scripts, styles or network access.  All data is
written with textContent / SVG attributes, never innerHTML.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan amortization</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --grid: #e4e3df;
    --series-1: #2a78d6; --series-2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7; --grid: #3a3a37;
      --series-1: #3987e5; --series-2: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7; --grid: #3a3a37;
    --series-1: #3987e5; --series-2: #d95926;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--surface-1); color: var(--text-primary);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .tile { flex: 1 1 140px; border: 1px solid var(--grid); border-radius: 8px; padding: 8px 12px; }
  .tile .k { color: var(--text-secondary); font-size: 12px; }
  .tile .v { font-size: 20px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
         border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; font-size: 12px;
         box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; display: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; font-size: 12px; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }
  details summary { cursor: pointer; color: var(--text-secondary); margin-top: 12px; }
  .empty { color: var(--text-secondary); }
</style>
</head>
<body>
<h1 id="title">Loan amortization</h1>
<div id="root"><p class="empty">Waiting for the tool result…</p></div>
<script>
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  var nextId = 1;
  var pending = {};

  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    var id = nextId++;
    send({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    return new Promise(function (resolve) { pending[id] = resolve; });
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

  function money(x) {
    return typeof x === "number" && isFinite(x)
      ? x.toLocaleString(undefined, { maximumFractionDigits: 0 }) : "–";
  }
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    for (var k in (attrs || {})) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = String(text);
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function applyTheme(ctx) {
    if (ctx && (ctx.theme === "dark" || ctx.theme === "light")) {
      document.documentElement.setAttribute("data-theme", ctx.theme);
    }
  }
  function reportSize() {
    notify("ui/notifications/size-changed",
           { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }

  function dataFrom(result) {
    if (!result || typeof result !== "object") return null;
    var sc = result.structuredContent;
    if (sc && typeof sc === "object") return sc.result && typeof sc.result === "object" ? sc.result : sc;
    var blocks = Array.isArray(result.content) ? result.content : [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i] && blocks[i].type === "text") {
        try { var v = JSON.parse(blocks[i].text); if (v && typeof v === "object") return v; } catch (e) { /* not JSON */ }
      }
    }
    return null;
  }

  function tile(parent, label, value) {
    var t = el("div", { "class": "tile" });
    t.appendChild(el("div", { "class": "k" }, label));
    t.appendChild(el("div", { "class": "v" }, value));
    parent.appendChild(t);
  }

  function render(d) {
    var root = document.getElementById("root");
    root.textContent = "";
    if (!d) { root.appendChild(el("p", { "class": "empty" }, "No loan data in the tool result.")); reportSize(); return; }

    var tiles = el("div", { "class": "tiles" });
    tile(tiles, "Monthly payment", money(d.monthly_payment));
    tile(tiles, "Total interest", money(d.total_interest));
    tile(tiles, "Total paid", money(d.total_paid));
    tile(tiles, "Term", (d.months || "–") + " months");
    root.appendChild(tiles);

    var rows = Array.isArray(d.yearly_schedule) ? d.yearly_schedule.filter(function (r) {
      return r && typeof r.principal === "number" && typeof r.interest === "number";
    }) : [];
    if (!rows.length) { reportSize(); return; }

    // Legend (two series: always present) — principal and interest paid per year, stacked.
    var legend = el("div", { "class": "legend" });
    [["Principal", "--series-1"], ["Interest", "--series-2"]].forEach(function (s) {
      var item = el("span");
      var sw = el("span", { "class": "sw" });
      sw.style.background = "var(" + s[1] + ")";
      item.appendChild(sw);
      item.appendChild(document.createTextNode(s[0]));
      legend.appendChild(item);
    });
    root.appendChild(legend);

    var W = 640, H = 240, m = { t: 8, r: 8, b: 24, l: 56 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, r.principal + r.interest); });
    max = max || 1;
    var chart = el("div", { "class": "chart" });
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
                             "aria-label": "Principal and interest paid per year" });
    for (var g = 0; g <= 4; g++) {
      var gy = m.t + ih - (ih * g / 4);
      svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: gy, y2: gy, stroke: "var(--grid)", "stroke-width": 1 }));
      var lab = svgEl("text", { x: m.l - 6, y: gy + 4, "text-anchor": "end", "font-size": 11, fill: "var(--text-secondary)" });
      lab.textContent = money(max * g / 4);
      svg.appendChild(lab);
    }
    var band = iw / rows.length, bw = Math.max(2, Math.min(28, band - 2));
    var tip = el("div", { "class": "tip" });
    rows.forEach(function (r, i) {
      var x = m.l + i * band + (band - bw) / 2;
      var hp = ih * r.principal / max, hi = ih * r.interest / max;
      var yP = m.t + ih - hp;
      // 2px surface gap between the stacked segments
      svg.appendChild(svgEl("rect", { x: x, y: yP, width: bw, height: Math.max(0, hp), fill: "var(--series-1)", rx: 2 }));
      svg.appendChild(svgEl("rect", { x: x, y: yP - hi, width: bw, height: Math.max(0, hi - 2), fill: "var(--series-2)", rx: 2 }));
      if (rows.length <= 12 || i % Math.ceil(rows.length / 10) === 0) {
        var xl = svgEl("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle", "font-size": 11, fill: "var(--text-secondary)" });
        xl.textContent = String(r.year);
        svg.appendChild(xl);
      }
      var hit = svgEl("rect", { x: m.l + i * band, y: m.t, width: band, height: ih, fill: "transparent" });
      hit.addEventListener("mousemove", function (ev) {
        tip.textContent = "";
        tip.appendChild(el("div", null, "Year " + r.year));
        tip.appendChild(el("div", null, "Principal " + money(r.principal)));
        tip.appendChild(el("div", null, "Interest " + money(r.interest)));
        tip.appendChild(el("div", null, "Balance " + money(r.balance)));
        var box = chart.getBoundingClientRect();
        tip.style.left = Math.min(ev.clientX - box.left + 12, box.width - 140) + "px";
        tip.style.top = (ev.clientY - box.top + 12) + "px";
        tip.style.display = "block";
      });
      hit.addEventListener("mouseleave", function () { tip.style.display = "none"; });
      svg.appendChild(hit);
    });
    chart.appendChild(svg);
    chart.appendChild(tip);
    root.appendChild(chart);

    // Table view (accessibility / exact values)
    var det = el("details");
    det.appendChild(el("summary", null, "Yearly schedule table"));
    var table = el("table");
    var head = el("tr");
    ["Year", "Principal", "Interest", "Balance"].forEach(function (h) { head.appendChild(el("th", null, h)); });
    table.appendChild(head);
    rows.forEach(function (r) {
      var tr = el("tr");
      [r.year, money(r.principal), money(r.interest), money(r.balance)].forEach(function (v) { tr.appendChild(el("td", null, v)); });
      table.appendChild(tr);
    });
    det.appendChild(table);
    det.addEventListener("toggle", reportSize);
    root.appendChild(det);
    reportSize();
  }

  window.addEventListener("message", function (ev) {
    if (ev.source !== window.parent) return;          // only the host may talk to the view
    var msg = ev.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id != null && pending[msg.id] && !msg.method) {
      var resolve = pending[msg.id]; delete pending[msg.id];
      resolve(msg.result || {});
      return;
    }
    switch (msg.method) {
      case "ui/notifications/tool-result": render(dataFrom(msg.params)); break;
      case "ui/notifications/host-context-changed": applyTheme(msg.params); break;
      case "ui/resource-teardown": if (msg.id != null) send({ jsonrpc: "2.0", id: msg.id, result: {} }); break;
      default:
        if (msg.id != null && msg.method) {
          send({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "Method not found" } });
        }
    }
  });

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "sajha-loan-amortization", version: "1.0.0" },
    appCapabilities: {}
  }).then(function (res) {
    applyTheme(res && res.hostContext);
    notify("ui/notifications/initialized", {});
    reportSize();
  });
})();
</script>
</body>
</html>
