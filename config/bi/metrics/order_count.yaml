# Sample metric over the DuckDB sample data (data/duckdb/orders.csv).
name: order_count
title: Completed orders
description: Number of completed orders.
owner: analyst
source:
  duckdb_table: orders
measure:
  sql: count(*)
  type: count
time:
  column: order_date
  grains: [day, week, month, quarter, year]
dimensions:
  - {name: region, column: region, values: [Central, East, North, South, West]}
  - {name: product_category, column: product_category}
  - {name: payment_method, column: payment_method}
  - {name: sales_rep, column: sales_rep}
filters:
  - "order_status = 'Completed'"
format: {unit: count, decimals: 0}
tags: [sales, kpi, sample]
