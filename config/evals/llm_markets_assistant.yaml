# An LLM-tool eval set (docs/architecture/Tool Quality.md §5): the example assistant (mode answer).
# Runs offline on the mock provider, whether or not the tool is enabled:
#   python -m sajha.quality eval llm_markets_assistant
name: llm_markets_assistant
description: The example markets assistant answers calculator questions with the right tool and number.
tool: llm_markets_assistant
models: [mock/mock-planner]
defaults:
  max_steps: 3
  max_tokens: 20000
  max_latency_ms: 30000
questions:
  - id: pct-change
    question: What is the percentage change from 80 to 100?
    expect_tools: [calc_percentage_change]
    answer:
      - number: 25
        tolerance: 0.01
  - id: npv
    question: What is the net present value NPV of cash flows -100, 50, 60 at discount rate 10
    expect_tools: [calc_npv]
    answer:
      - regex: "-?4\\.96"
