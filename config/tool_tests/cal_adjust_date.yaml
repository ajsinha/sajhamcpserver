# Tool test cases (docs/architecture/Tool Quality.md §2). Offline: cal_adjust_date computes from the holidays package,
# so the case makes no HTTP call and needs no cassette.
tool: cal_adjust_date
cases:
  - name: saturday modified following on xlon
    tags: [smoke]
    arguments: {"date": "2026-10-31", "rule": "modified_following", "calendars": ["XLON"]}
    expect:
      - schema: output
      - path: "$.adjusted"
        equals: "2026-10-30"
      - path: "$.changed"
        equals: true
probe:
  case: saturday modified following on xlon
  every: 3600
