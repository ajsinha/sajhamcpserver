# HTTP tool without a cassette yet: the api.data.gov DEMO_KEY allowance (10 requests, then about a day's
# Retry-After) ran out while the routes were being verified on 2026-10-12, and no EIA_API_KEY was available,
# so the case is skipped rather than replayed from an invented recording. With a key, record it (and remove
# the skip) with: python -m sajha.quality test --tool eia_short_term_outlook --record   (the api_key parameter is redacted)
tool: eia_short_term_outlook
cases:
  - name: brent henry hub 2026 2027
    tags: [http]
    skip: "needs EIA_API_KEY to record its cassette (the DEMO_KEY allowance ran out in wave 16)"
    arguments: {"series": ["brent", "henry_hub"], "period": "2026-01-01:2027-12-31"}
    expect:
      - schema: output
      - path: "$.series_count"
        equals: 2
      - path: "$.series[0].observation_count"
        equals: 24
      - path: "$.series[0].unit"
        equals: "dollars per barrel"
