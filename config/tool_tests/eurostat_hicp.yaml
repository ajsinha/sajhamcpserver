# An HTTP tool with a recorded cassette (cassettes/eurostat_hicp/germany_france_euro_area_2026h1.json): replays offline.
# Re-record against the live API with: python -m sajha.quality test --tool eurostat_hicp --record
tool: eurostat_hicp
cases:
  - name: germany france euro area 2026h1
    tags: [http]
    arguments: {"countries": ["DE", "FR", "EA"], "measure": "annual_rate", "period": "2026-01/2026-06", "item": "TOTAL"}
    expect:
      - schema: output
      - path: "$.series_count"
        equals: 3
      - path: "$.source"
        regex: "^Source: Eurostat"
probe:
  case: germany france euro area 2026h1
  every: 21600
