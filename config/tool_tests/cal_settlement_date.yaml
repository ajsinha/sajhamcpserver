# Tool test cases (docs/architecture/Tool Quality.md §2). Offline: cal_settlement_date computes from the holidays package,
# so the case makes no HTTP call and needs no cassette.
tool: cal_settlement_date
cases:
  - name: t+1 over thanksgiving
    tags: [smoke]
    arguments: {"trade_date": "2026-11-25", "convention": "T+1", "calendars": ["XNYS"]}
    expect:
      - schema: output
      - path: "$.settlement_date"
        equals: "2026-11-27"
      - path: "$.trade_date_is_business_day"
        equals: true
probe:
  case: t+1 over thanksgiving
  every: 3600
