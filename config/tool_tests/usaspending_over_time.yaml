# An HTTP tool with a recorded cassette (cassettes/usaspending_over_time/cybersecurity_by_fiscal_year_2023_to_2026.json): replays offline.
# Re-record against the live API with: python -m sajha.quality test --tool usaspending_over_time --record
tool: usaspending_over_time
cases:
  - name: cybersecurity by fiscal year 2023 to 2026
    tags: [http]
    arguments: {"group": "fiscal_year", "keywords": ["cybersecurity"], "from": "2022-10-01", "to": "2026-09-30"}
    expect:
      - schema: output
      - path: "$.count"
        equals: 4
      - path: "$.points[0].period"
        equals: "2023"
probe:
  case: cybersecurity by fiscal year 2023 to 2026
  every: 3600
