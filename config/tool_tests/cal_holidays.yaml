# Tool test cases (docs/architecture/Tool Quality.md §2). Offline: cal_holidays computes from the holidays package,
# so the case makes no HTTP call and needs no cassette.
tool: cal_holidays
cases:
  - name: xnys 2026
    tags: [smoke]
    arguments: {"market": "XNYS", "year": 2026}
    expect:
      - schema: output
      - path: "$.count"
        equals: 10
      - path: "$.holidays[0].date"
        equals: "2026-01-01"
      - path: "$.holidays[*].name"
        regex: "Thanksgiving|Christmas|New Year|King|Washington|Good Friday|Memorial|Juneteenth|Independence|Labor"
probe:
  case: xnys 2026
  every: 3600
