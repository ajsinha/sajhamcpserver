# An HTTP tool with a recorded cassette (cassettes/bls_ppi/final_demand_2025.json): replays offline.
# Re-record against the live API with: python -m sajha.quality test --tool bls_ppi --record
# (record without BLS_API_KEY/EIA_API_KEY set so the cassette matches a keyless replay)
tool: bls_ppi
cases:
  - name: final demand 2025
    tags: [http]
    arguments: {"measures": ["final_demand", "core"], "period": "2025-01-01:2025-12-31"}
    expect:
      - schema: output
      - path: "$.series_count"
        equals: 2
      - path: "$.series[0].observation_count"
        equals: 12
      - path: "$.series[0].series_id"
        equals: "WPSFD4"
probe:
  case: final demand 2025
  every: 86400
