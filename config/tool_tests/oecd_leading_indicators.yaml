# An HTTP tool with a recorded cassette (cassettes/oecd_leading_indicators/cli_us_germany_g20_2026h1.json): replays offline.
# Re-record against the live API with: python -m sajha.quality test --tool oecd_leading_indicators --record
tool: oecd_leading_indicators
cases:
  - name: cli us germany g20 2026h1
    tags: [http]
    arguments: {"countries": ["USA", "DE", "G20"], "indicators": ["cli"], "period": "2026-01/2026-06"}
    expect:
      - schema: output
      - path: "$.series_count"
        equals: 3
      - path: "$.source"
        regex: "^Source: OECD"
probe:
  case: cli us germany g20 2026h1
  every: 86400
