# An HTTP tool with a recorded cassette (cassettes/eurostat_government_debt/italy_france_euro_area_2025.json): replays offline.
# Re-record against the live API with: python -m sajha.quality test --tool eurostat_government_debt --record
tool: eurostat_government_debt
cases:
  - name: italy france euro area 2025
    tags: [http]
    arguments: {"countries": ["IT", "FR", "EA"], "unit": "percent_of_gdp", "period": "2025-Q1/2026-Q1"}
    expect:
      - schema: output
      - path: "$.series_count"
        equals: 3
      - path: "$.source"
        regex: "^Source: Eurostat"
probe:
  case: italy france euro area 2025
  every: 21600
