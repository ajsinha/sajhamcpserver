# ============================================================================
# SAJHA MCP Server — Application Configuration (the version is app.version below)
# Copyright All rights Reserved 2025-2030, Ashutosh Sinha
#
# Features:
#   - Environment variable substitution:  ${VAR:default_value}
#   - Override any key via env var:        SAJHA_DB_HOST=prod-db.internal
#   - Nested keys flatten to dot notation: db.host, server.port, etc.
#   - Supports .env file for local development
# ============================================================================

app:
  name: SAJHA MCP Server
  version: 8.1.0
  description: Model Context Protocol Server
  author: Ashutosh Sinha
  author_email: ajsinha@gmail.com       # shown with the copyright notice; SAJHA is proprietary (see LICENSE)
  email: ajsinha@gmail.com
  copyright_years: "2025-2030"
  github:
    repo: https://github.com/ajsinha/sajhamcpserver
    repo_name: ajsinha/sajhamcpserver

server:
  host: ${SERVER_HOST:0.0.0.0}
  port: ${SERVER_PORT:3002}
  debug: false
  max_request_bytes: 10485760    # larger request bodies get 413 (Content-Length or streamed)
  trusted_proxies: ""            # proxies whose X-Forwarded-For/-Proto count (uvicorn forwarded_allow_ips);
                                 # empty: uvicorn's default (FORWARDED_ALLOW_IPS, else 127.0.0.1)
  tls:                           # serve https directly (else terminate TLS at a proxy)
    certfile: ""
    keyfile: ""
    min_version: TLSv1.2         # TLSv1.2 or TLSv1.3

# ── Browser and transport hardening ─────────────────────────────────────────
# docs/security/Security Model.md section 3
security:
  allowed_hosts: []              # Host header allow-list (exact or *.example.com); empty: any. Loopback always passes
  hsts:
    max_age: 31536000            # Strict-Transport-Security on https responses; 0: not sent
    include_subdomains: true
  csrf:
    trusted_origins: []          # other origins whose pages may send cookie-authenticated changes

# ── Database ─────────────────────────────────────────────────────────────────
# One schema file per dialect, no migrations: db/scripts/<sqlite|postgresql>/schema.sql
# (+ seed.sql: default roles and admin).  SQLite: SAJHA runs them at start-up.
# PostgreSQL: SAJHA runs no DDL; an operator runs them once with psql.
# docs/getting-started/Database Setup.md
# Both are idempotent (CREATE TABLE IF NOT EXISTS / INSERT ... safe to re-run).
#
# Default: SQLite (zero config, single file, good for dev/small production).
# For production: uncomment the PostgreSQL block below and comment out SQLite.

db:
  # ── SQLite (default — works out of the box) ──
  type: sqlite
  path: data/sajha.db

  # ── PostgreSQL (uncomment for production) ──
  # type: postgresql
  # host: ${DB_HOST:localhost}
  # port: ${DB_PORT:5432}
  # name: ${DB_NAME:sajha}
  # user: ${DB_USER:sajha}
  # password: ${DB_PASSWORD:change-me-in-production}
  # driver: psycopg2                      # psycopg2 (sync) | asyncpg (async)
  # ssl: false                            # Set true for cloud-hosted PostgreSQL
  #
  # ── PostgreSQL on AWS RDS ──
  # type: postgresql
  # host: ${SAJHA_DB_HOST:sajha-db.xxxx.us-east-1.rds.amazonaws.com}
  # port: ${SAJHA_DB_PORT:5432}
  # name: ${SAJHA_DB_NAME:sajha}
  # user: ${SAJHA_DB_USER:sajha}
  # password: ${SAJHA_DB_PASSWORD:}       # Set via env var or Secrets Manager
  # driver: psycopg2
  # ssl: true
  #
  # ── PostgreSQL on Hetzner Managed DB ──
  # type: postgresql
  # host: ${DB_HOST:your-db.hetzner.cloud}
  # port: ${DB_PORT:5432}
  # name: ${DB_NAME:sajha}
  # user: ${DB_USER:sajha}
  # password: ${DB_PASSWORD:}
  # driver: psycopg2
  # ssl: true

  pool:
    size: ${DB_POOL_SIZE:10}
  echo: false                             # Log all SQL statements (debug only)
  scripts_dir: db/scripts                 # <scripts_dir>/<sqlite|postgresql>/schema.sql and seed.sql
  # Start-up check of the tables and columns SAJHA uses (python -m sajha.db check runs it too).
  # strict = refuse to start while any is missing, naming them and the psql command; warn = log and start.
  schema_check: strict                    # strict | warn  (env SAJHA_DB_SCHEMA_CHECK)

# ── Process-shared state (several workers / hosts) ───────────────────────────
# OAuth codes, MCP sessions and tasks, rate limits, LLM budgets and change
# notifications.  memory = this process only (one worker).  Run more than one
# worker or host?  Use redis (or database).  docs/architecture/Scaling and State.md

state:
  backend: memory                         # memory | redis | database  (env SAJHA_STATE_BACKEND)
  key_prefix: "sajha:"                    # namespace for every key and channel
  redis:
    url: redis://localhost:6379/0         # env SAJHA_STATE_REDIS_URL (put a password there, not here)
  database:
    url: ""                               # empty = SAJHA's own database (db.*)
    poll_interval_ms: 500                 # pub/sub latency of the database backend
  tasks:
    durable: auto                         # auto = on for redis/database: MCP task records in the database

# ── Authentication ───────────────────────────────────────────────────────────

auth:
  # Secrets: leave empty and SAJHA generates each one once into auth.secrets_file
  # (default <data.dir>/secrets/server_secrets.json, mode 0600, git-ignored), or set
  # JWT_SECRET / SESSION_SECRET in the environment (same value on every instance).
  # Publicly known placeholder values are refused at start-up.  Never put a secret here.
  jwt:
    secret: ${JWT_SECRET:}
    algorithm: HS256
    expiry_minutes: ${JWT_EXPIRY:60}
  session:
    secret_key: ${SESSION_SECRET:}
    timeout_minutes: 60
  secrets_file: ""                        # default: <data.dir>/secrets/server_secrets.json
  # How passwords and API keys are stored: plain (as given; the owner's intranet setting) or hashed
  # (bcrypt / SHA-256). Values stored either way keep working after a switch; to hash everything run
  # `python -m sajha.auth rehash`. docs/security/Security Model.md "Credential storage and files"
  credential_storage: plain
  users_file:
    path: config/users.json             # administrators' users; always win over the database
  credential_files:
    reload_check_seconds: 300           # config/users.json and config/apikeys.json: held in memory; checked
                                        # for hand edits at most this often (page edits apply at once)
  api_keys:
    db_dump_path: config/apikeys_db.json  # the database's keys, written every interval (fallback)
    db_dump_interval_minutes: 10
  # Sign-in protection: the web form, POST /api/auth/login and the OAuth consent sign-in
  login:
    max_failed_attempts: 5                # consecutive failures that lock the account
    lockout_minutes: 15
    ip_max_failures: 20                   # failed sign-ins per client IP per window -> 429
    ip_window_seconds: 300
  # The console session cookie (sajha_token): HttpOnly, SameSite=Lax. Secure: auto (when the request
  # came over https; behind a TLS proxy set server.trusted_proxies), true or false.
  cookie:
    secure: auto
  # Console single sign-on: OpenID Connect (authorization code + PKCE) against your identity provider.
  # Off by default; password sign-in and the users file keep working alongside it. Instances of a
  # net that trust the same provider share one sign-in. docs/security/Security Model.md
  # "Console single sign-on". The client secret comes from SAJHA_AUTH_SSO_CLIENT_SECRET, never here.
  sso:
    enabled: false
    issuer: ""                            # e.g. https://login.example.com/realms/acme
    client_id: ""
    scopes: openid profile email
    redirect_uri: ""                      # default: <mcp.auth.public_url or this server>/auth/sso/callback
    label: Single sign-on                 # the login page button: "Sign in with <label>"
    user_claim: preferred_username        # the claim that names the SAJHA user (or email, sub, ...)
    roles_claim: ""                       # e.g. groups or realm_access.roles; empty: no role mapping
    role_map: []                          # ["<claim value>=<SAJHA role>", ...]
    default_roles: [user]                 # roles of a created user when no mapped role applies
    auto_provision: false                 # create a SAJHA user on first sign-in
    link_existing: true                   # an existing user with the same name is linked on first sign-in
    sync_roles: false                     # replace a user's roles with the mapped ones at each sign-in
    require_role: false                   # refuse a sign-in that maps to no role
    auto_redirect: false                  # /login goes straight to the provider (/login?local=1: password form)
    idp_logout: true                      # sign-out also ends the provider session (end_session_endpoint)

# ── MCP transport (Streamable HTTP, spec 2025-11-25) ────────────────────────
mcp:
  # Browser Origins allowed to call /mcp (DNS-rebinding protection; others get 403).
  # Requests without an Origin header and http(s)://localhost, 127.0.0.1 or
  # [::1] on any port are always allowed.  Add exact origins
  # (scheme://host[:port]) for browser-based MCP clients, or "*" to disable.
  # Env override: SAJHA_MCP_ALLOWED_ORIGINS="https://a.example.com,https://b.example.com"
  allowed_origins: []
  tools:
    # Emit each tool's outputSchema in tools/list and return structuredContent
    # from tools/call. MCP clients validate structuredContent against it.
    advertise_output_schema: true
  # Expose the official conformance-suite test tools/prompts/resources
  # (test_simple_text, test://static-text, ...). For protocol testing only.
  # Env override: SAJHA_MCP_CONFORMANCE_FIXTURES=true
  conformance_fixtures: false
  # MCP 2026-07-28 caching hints (SEP-2549): ttlMs/cacheScope on server/discover,
  # tools/list, prompts/list, resources/list, resources/templates/list and
  # resources/read results (modern, stateless requests only).
  cache:
    discover_ttl_ms: 300000      # server/discover
    list_ttl_ms: 60000           # tools/prompts/resources/templates list results
    read_ttl_ms: 30000           # resources/read
    # auto: "private" when a result depends on the caller (per-user tool
    # filtering), else "public".  Or force "public" / "private".
    scope: auto
  # MCP 2026-07-28 Multi Round-Trip Requests (SEP-2322): the opaque requestState
  # returned with an InputRequiredResult is HMAC-SHA256 signed and bound to the
  # method, tool/prompt/URI, arguments and caller.  Set a stable secret when
  # running several workers or to keep states valid across restarts; when empty
  # it is derived from auth.session.secret_key (persisted in auth.secrets_file).
  # Env override: SAJHA_MCP_MRTR_STATE_SECRET
  mrtr:
    state_secret: ""
    state_ttl_seconds: 900
  # Callers with no credentials (possible while mcp.auth.mode is off or optional).
  # tools/list and tools/call apply the same per-tool access rules as the REST API:
  # users by their roles' permissions, API keys by their allow/deny list, anonymous
  # callers by this allowlist (fnmatch patterns, e.g. ["calc_*", "wikipedia_search"]).
  # Default: anonymous callers see and run no registry tools.  The conformance
  # fixtures (test_*, present only when conformance_fixtures is on) stay callable.
  # Env: SAJHA_MCP_ANONYMOUS_ENABLED=false  SAJHA_MCP_ANONYMOUS_TOOLS="calc_*,wiki_*"
  anonymous:
    enabled: true                 # false: credentials required on every MCP transport and /a2a
    role: ""                      # optional: also grant the tool permissions of this SAJHA role
    tools: []
    # Prompts an anonymous caller may list/get (fnmatch). Signed-in callers see every
    # prompt. The tool and prompt catalogs (resources), completion/complete and
    # /.well-known/agent.json follow the same rules. Env: SAJHA_MCP_ANONYMOUS_PROMPTS
    prompts: []
    # Data-file resources (sajha://data/<file>) an anonymous caller may list/read:
    # fnmatch over the URI, e.g. ["sajha://data/products.csv"] or ["sajha://data/*"].
    # Signed-in callers read every one. Env: SAJHA_MCP_ANONYMOUS_RESOURCES
    resources: []
  # Ask the user (form-mode elicitation via MRTR) before running a tool whose
  # config sets annotations.destructiveHint: true.  Only when the client
  # declares the elicitation capability; otherwise the call runs as before.
  confirm_destructive_tools: false
  # Tasks extension io.modelcontextprotocol/tasks (SEP-2663), 2026-07-28 only.
  # A tool opts in with "execution": {"taskSupport": "optional" | "required"}
  # in its config.  Tasks live in memory in this process (use one worker or
  # sticky routing), scoped to the calling user.
  tasks:
    enabled: true
    ttl_ms: 3600000              # how long a task stays readable via tasks/get
    poll_interval_ms: 500        # pollIntervalMs hint returned to clients
    max_tasks: 1000
  # subscriptions/listen (2026-07-28): max concurrent listen streams
  subscriptions:
    max_streams: 1000
  # OAuth 2.1 authorization for /mcp (MCP authorization spec, 2025-11-25 and
  # 2026-07-28).  Existing credentials (X-API-Key / sja_ keys, SAJHA login JWTs,
  # the session cookie) keep working in every mode.
  #   off       no OAuth: anonymous calls allowed, no discovery documents (404)
  #   optional  OAuth bearer tokens accepted and validated; anonymous still allowed
  #   required  401 + WWW-Authenticate (resource_metadata, scope) without credentials
  # Env override: SAJHA_MCP_AUTH_MODE=required
  auth:
    mode: "off"                 # quoted: bare off is a YAML boolean
    # "builtin" (SAJHA's own authorization server, backed by SAJHA users) or an
    # external issuer URL, e.g. https://login.example.com/realms/mcp (Keycloak),
    # https://dev-123.okta.com/oauth2/default, https://login.microsoftonline.com/<tenant>/v2.0
    # With an external issuer SAJHA only validates its JWT access tokens
    # (discovery + JWKS); opaque tokens / introspection are not supported.
    authorization_server: builtin
    # Externally visible origin, e.g. https://mcp.example.com.  Token audience
    # (resource = <public_url>/mcp) and the built-in issuer derive from it.
    # Empty: taken from each request's Host (local development only).
    public_url: ""
    # Scopes in Protected Resource Metadata and 401 challenges.  tools/call
    # needs mcp:tools, every other method mcp:read; "mcp" implies both.
    scopes: "mcp:read mcp:tools"
    # Extra token "aud" values to accept (comma-separated), e.g. an Entra
    # application ID URI.  The resource URIs of /mcp and /api/mcp always are.
    accepted_audiences: ""
    clock_skew_seconds: 60
    jwks_cache_seconds: 3600
    external:
      # Token claim matched against SAJHA user IDs (unmatched -> least-privilege
      # api_consumer identity).  Use only a claim the IdP controls.
      user_claim: sub
    builtin:
      access_token_ttl_seconds: 900
      refresh_token_ttl_seconds: 2592000
      code_ttl_seconds: 60
      # offline_access (refresh token only when that scope is granted) | always | never
      refresh_tokens: offline_access
      # Generated on first use (RSA-2048, mode 0600).  Never commit it.
      signing_key_path: ""          # default: <data.dir>/oauth/signing_key.pem
      cimd:                         # Client ID Metadata Documents (https URL client_ids)
        enabled: true
        allow_localhost: false      # dev only: accept http://localhost client_id URLs
        allow_private_networks: false
        timeout_seconds: 5
        max_bytes: 16384
      # RFC 7591 Dynamic Client Registration (deprecated in MCP 2026-07-28;
      # registrations are kept in memory).
      dynamic_client_registration: false
      # Pre-registered clients (env override: SAJHA_MCP_AUTH_BUILTIN_CLIENTS as JSON).
      # client_secret may use ${ENV_VAR}; omit it for public (PKCE-only) clients.
      clients: []
      #  - client_id: my-agent
      #    client_name: My Agent
      #    redirect_uris: ["http://127.0.0.1:8765/callback"]
      #    client_secret: ${MY_AGENT_SECRET:}
  # MCP Apps extension io.modelcontextprotocol/ui (2026-07-28 requests only):
  # tools whose config has "_meta": {"ui": {"resourceUri": "ui://..."}} get an
  # interactive HTML view served by resources/read as text/html;profile=mcp-app.
  apps:
    enabled: true

# ── Config Paths ─────────────────────────────────────────────────────────────

config:
  tools:
    dir: config/tools
  prompts:
    dir: config/prompts
  plugins:
    dir: config/plugins
  apikeys:
    path: config/apikeys.json
  ir:
    dir: config/ir

# ── Hot Reload ───────────────────────────────────────────────────────────────

hot_reload:
  enabled: true
  interval_seconds: 300

# ── Features ─────────────────────────────────────────────────────────────────

features:
  websocket:
    enabled: true
  monitoring:
    enabled: true
  admin:
    panel:
      enabled: true

# ── Logging ──────────────────────────────────────────────────────────────────

logging:
  level: ${LOG_LEVEL:INFO}
  dir: ./logs                              # Log directory (created if missing)
  file: server.log                         # Log file name in logging.dir (empty = stdout only)

# ── Data Directories ────────────────────────────────────────────────────────

data:
  dir: ./data                              # Base data directory
  duckdb:
    dir: ./data/duckdb
  sqlselect:
    dir: ./data/sqlselect

# ── Storage backend (filesystem abstraction: local on-prem, S3 on AWS) ───────
# Routes read/write IO through sajha.core.storage. 'local' is a no-op wrapper
# over the filesystem (works for laptop disk, EBS, or an EFS mount — EFS is just
# a path, not a separate backend). 's3' reads/writes an object-storage bucket
# with a local read-through cache. Mutable state (the SQLite DB, audit log,
# cache) is NOT an S3 candidate — keep it on a real filesystem (EFS) or a
# managed service (RDS). See docs/getting-started/Storage Guide.md.
storage:
  backend: local                           # local | s3 | azure | gcs  (env: SAJHA_STORAGE_BACKEND)
  base_dir: "."                            # base dir for the local backend
  s3:
    bucket: ""                            # env: SAJHA_S3_BUCKET
    prefix: "sajha/"                       # key prefix within the bucket
    region: us-east-1                        # env: AWS_DEFAULT_REGION
    endpoint_url: ""                         # optional: MinIO / Cloudflare R2 / Wasabi
    cache_dir: /tmp/sajha-cache              # local mirror for importlib / real-file needs
    sync_interval: 60                        # S3SyncManager poll seconds (hot-reload equivalent)
  azure:                                     # backend: azure  (azure-storage-blob)
    container: ""                         # env: SAJHA_AZURE_CONTAINER
    account_url: ""                        # https://<acct>.blob.core.windows.net — uses managed identity (env: SAJHA_AZURE_ACCOUNT_URL)
    connection_string: ""                  # alternative auth (env: AZURE_STORAGE_CONNECTION_STRING) — keep secrets in env, not here
    prefix: "sajha/"
    cache_dir: /tmp/sajha-cache
  gcs:                                       # backend: gcs  (google-cloud-storage)
    bucket: ""                            # env: SAJHA_GCS_BUCKET
    project: ""                           # env: GOOGLE_CLOUD_PROJECT — uses Application Default Credentials / workload identity
    prefix: "sajha/"
    cache_dir: /tmp/sajha-cache

# ── External API Keys ───────────────────────────────────────────────────────

fmp:
  api:
    key: ${FMP_API_KEY:}

google:
  api:
    key: ${GOOGLE_API_KEY:}
  search:
    engine:
      id: ${GOOGLE_SEARCH_ENGINE_ID:}

fred:
  api:
    key: ${FRED_API_KEY:}

fbi:                                         # FBI Crime Data Explorer (api.data.gov key; falls back to DEMO_KEY)
  api:
    key: ${FBI_API_KEY:}

tavily:
  api:
    key: ${TAVILY_API_KEY:}

alpha_vantage:
  api:
    key: ${ALPHA_VANTAGE_API_KEY:}

# SharePoint tools (config/tools/sharepoint_*.json) call Microsoft Graph with an Entra ID
# app registration (client-credentials grant). Empty by default: the tools answer
# "SharePoint is not configured" until these are set. Secrets come from the environment.
sharepoint:
  site:
    url: ${SHAREPOINT_SITE_URL:}               # e.g. https://contoso.sharepoint.com/sites/team
  client:
    id: ${SHAREPOINT_CLIENT_ID:}
    secret: ${SHAREPOINT_CLIENT_SECRET:}

azure:
  tenant:
    id: ${AZURE_TENANT_ID:}                    # the Entra ID (Azure AD) tenant of that app

# ── AI Integration (intelligence layer) ─────────────────────────────────────
# Full reference: docs/architecture/Intelligence Layer.md (every key, its env override, defaults).
#
# Out of the box the offline MOCK provider serves every alias, so /api/ai/ask works with no
# keys. Real providers are listed below but disabled; a key in the environment never enables
# one by itself. To switch to a real provider:
#   1. enable it:      SAJHA_AI_OPENAI_ENABLED=true      (or enabled: true below)
#   2. give it a key:  OPENAI_API_KEY=...  or  SAJHA_AI_OPENAI_API_KEY=...  (never in this file)
#   3. point an alias: SAJHA_AI_ALIASES_DEFAULT=openai,mock/mock-planner
# Every provider setting is overridable as SAJHA_AI_<PROVIDER>_<FIELD> (env wins over this file);
# gateway sections likewise: SAJHA_AI_ASK_MAX_STEPS, SAJHA_AI_RETRY_MAX_RETRIES, SAJHA_AI_CACHE_ENABLED ...
# The effective configuration (values redacted, with their source) is GET /api/ai/config (admin).
ai:
  providers:
    - name: mock                         # offline, deterministic; the default
      config:
        enabled: true
        latency_ms: [0, 0]               # fault injection: uniform latency range (seeded)
        fail_every: 0                    # every Nth call fails with fail_with; 0 = never
        fail_with: rate_limited          # rate_limited | unavailable | auth | context_too_long | content_filtered
        seed: 42
        scripts_dir: config/ai/mock_scripts
    - { name: anthropic,    config: { enabled: false } }
    - { name: openai,       config: { enabled: false } }
    - { name: azure_openai, config: { enabled: false, api_style: v1 } }
    - { name: gemini,       config: { enabled: false } }
    - { name: bedrock,      config: { enabled: false, region: us-east-1 } }    # needs: pip install boto3
    - { name: mistral,      config: { enabled: false } }
    - { name: cohere,       config: { enabled: false } }
    - { name: ollama,       config: { enabled: false, base_url: "http://localhost:11434" } }
    - { name: groq,         config: { enabled: false } }
    - { name: together,     config: { enabled: false } }
    - { name: fireworks,    config: { enabled: false } }
    - { name: deepseek,     config: { enabled: false } }
    - { name: xai,          config: { enabled: false } }
    - { name: openrouter,   config: { enabled: false } }
    - { name: perplexity,   config: { enabled: false } }
    - { name: vllm,         config: { enabled: false, base_url: "http://localhost:8000/v1" } }
    - { name: lmstudio,     config: { enabled: false, base_url: "http://localhost:1234/v1" } }
  # Ordered candidates per alias; a bare provider name means its default_model.
  aliases:
    default:   [mock/mock-planner]
    fast:      [mock/mock-planner]
    reasoning: [mock/mock-planner]
    embedding: [mock/mock-embed]
    toolsmith: [mock/mock-toolsmith]   # Studio "Describe a tool" (studio.describe.model)
  policy:
    enabled: true
    roles:
      viewer: { allowed: ["mock/*"], tools: false }
  budgets:
    enabled: true
    per_user_daily_tokens: ${AI_PER_USER_DAILY_TOKENS:}
  retry:
    max_retries: 2
    backoff_base_s: 0.5
    backoff_max_s: 20
  breaker:
    failure_threshold: 5
    recovery_timeout_s: 60
  ask:
    model: default
    max_steps: 6
    max_tool_calls: 10
    timeout_s: 60
    shortlist: 12
    max_result_chars: 4000
    mcp_tool_enabled: false            # register the sajha_ask MCP tool
    planner: react                     # a planner in config/planners (react, plan_execute, router, auto, ...)
    locality: any                      # where offered tools may run: any | local (this server's own) | net:<name>
                                       # (own tools and that SAJHA Net net's); a planner's settings.locality narrows it
  # Planners: config/planners/<name>.yaml, bounded graphs of stages (docs/architecture/Planner
  # Reference.md). The limits are CEILINGS a planner file may tighten, never raise.
  # Env: SAJHA_AI_PLANNERS_<FIELD>, SAJHA_AI_PLANNERS_LIMITS_<FIELD>.
  planners:
    dir: config/planners               # read through the storage backend; reloaded on change
    default: react                     # an LLM tool's planner when it names none
    python_builtins: false             # true: react/plan_execute/recipes/router run the Python classes
    limits:
      max_stages_run: 40
      max_visits_per_edge: 10
      max_subplanner_depth: 2
      max_parallel: 4
      max_samples: 5
      max_foreach_items: 50
  # SAJHA as an OpenAI-compatible endpoint: POST /v1/chat/completions, GET /v1/models,
  # POST /v1/embeddings, authenticated with a SAJHA API key as the bearer token (docs/architecture/
  # LLM Tools.md §13.4). Off by default. Env: SAJHA_AI_OPENAI_API_<FIELD>.
  openai_api:
    enabled: false
    llm_tools: true                    # enabled LLM tools appear as models sajha:<tool>
  # LLM tools: tools whose work a model does (docs/architecture/LLM Tools.md). Every value is a
  # CEILING: a tool's own llm.limits may ask for less, never more. Env: SAJHA_AI_LLM_TOOLS_<SECTION>_<FIELD>.
  llm_tools:
    enabled: true                      # the tool type; each LLM tool still has its own "enabled"
    default_model: default             # alias used by a tool that names no model
    max_depth: 2                       # LLM tools nested inside LLM tools (nesting.allow)
    limits: { max_steps: 8, max_tool_calls: 16, timeout_s: 120, max_input_chars: 20000, max_output_tokens: 4000, max_cost_usd: 1.00 }
    anonymous: { enabled: false, max_steps: 3, max_cost_usd: 0.02 }
    memory:
      max_turns: 50                    # per tool conversation; older turns fold into the summary
      max_conversations_per_tool: 50
      purge_interval_minutes: 15
      working_set_max_kb: 2048         # per running call; larger items spill to the spool
      spill_threshold_kb: 256          # a tool result larger than this is spooled at once
      cache: { enabled: false, max_mb: 64, ttl_s: 300 }    # optional write-through conversation hot cache
      spool: { dir: data/spool/llm_tools, max_mb: 1024, per_run_mb: 128, orphan_minutes: 60 }
    runtime:
      max_concurrent_runs: 8           # per process; more wait in the queue, then get stopped_by busy
      max_queued: 32
      queue_timeout_s: 30
      memory_guard: { soft_pct: 70, hard_pct: 85, soft_mb: 0, hard_mb: 0, interval_s: 2 }
    result_cache: { max_entries: 1000, ttl_s: 3600 }        # deterministic modes with "cache": true
  # Conversation memory (ai.memory.*) uses its defaults; docs/getting-started/Configuration
  # Reference.md lists every key.
  # Document search (sajha/ai/rag): where the passage index lives. Env: SAJHA_AI_RAG_<KEY>,
  # and SAJHA_AI_RAG_STORES_<STORE>_<KEY> per store (e.g. SAJHA_AI_RAG_STORES_PGVECTOR_DSN).
  rag:
    store: auto                        # auto (sqlite_vec, else memory) | sqlite_vec | memory | pgvector | package.module:Class
    stores:
      sqlite_vec:
        path: data/rag/vectors.db      # a SQLite file of its own (never SAJHA's database)
      pgvector:
        dsn: ""                        # empty = SAJHA's database; put a DSN in the env, not here
    embed_batch_size: 64               # passages per embedding call while indexing
  # Semantic tool search — natural-language query → top-k matching tools.
  tool_search:
    enabled: true
    embedder: ${AI_TOOL_SEARCH_EMBEDDER:bm25}   # bm25 (lexical, default, no deps) | gateway (API embeddings)
    persist: true                                # persist the vector index (gateway mode) via storage
    top_k: 5
  cache:
    enabled: true
    ttl_seconds: 3600

# ── Tool Output Cache ────────────────────────────────────────────────────────
# File-based cache for tool results. Each entry is a JSON file on disk.
# Default: disabled per tool. Tools opt in via "cache_ttl" in their JSON config.

cache:
  enabled: ${CACHE_ENABLED:true}          # Master switch — false disables all caching
  dir: ${CACHE_DIR:data/cache}            # Directory for cache files
  max_files: ${CACHE_MAX_FILES:50000}     # Maximum number of cache files before eviction
  max_file_size_kb: ${CACHE_MAX_FILE_KB:512}  # Skip caching results larger than this (KB)
  cleanup_interval_seconds: 300           # How often to purge expired files (0 = disabled)
  # Per-tool TTL is set in each tool's JSON config: "cache_ttl": 3600
  # Setting cache_ttl: 0 or omitting it means no caching for that tool.
  # "cache_per_user": true in a tool's config keys its results by caller as well.
  per_user_federated: true                # federated tools without cache_per_user are keyed per user

# ── Async Tool Execution ─────────────────────────────────────────────────────
# Background execution with result delivery via webhook, Kafka, or filesystem.
# Client gets task_id immediately; result delivered when ready.

async:
  enabled: ${ASYNC_ENABLED:true}
  workers: ${ASYNC_WORKERS:8}             # Daemon threads in worker pool
  queue_size: ${ASYNC_QUEUE_SIZE:1000}    # Max pending tasks (503 on overflow)
  task_ttl_hours: ${ASYNC_TASK_TTL:24}    # Retain completed tasks for N hours
  # Submitting needs the admin role or a role permission (resource_type "async",
  # action "execute"), plus execute access to the tool itself.
  delivery:
    webhook:
      timeout: 10
      max_retries: 3
      # Destinations a webhook may POST to: URL prefixes (scheme://host[:port][/path]).
      # Empty = webhook delivery refused.  Targets must resolve to public addresses
      # unless allow_private_networks is true.  Env: SAJHA_ASYNC_DELIVERY_WEBHOOK_ALLOWED_URLS
      allowed_urls: []
      allow_private_networks: false
    kafka:
      bootstrap_servers: ${KAFKA_BROKERS:localhost:9092}
    file:
      # Files are written only inside this directory (relative paths; no traversal)
      base_dir: ${ASYNC_FILE_DIR:data/async_results}
      max_size_mb: 50

# ── Workflows (sajha/workflows; docs/architecture/Workflows.md) ──────────────
# DAGs of tool, composite and Ask SAJHA steps with cron, webhook, file and event
# triggers. Runs are stored in the workflow_runs tables; several workers need a
# shared state store (state.backend redis|database) so a schedule fires once.
# Outputs are delivered through async.delivery (the same allow-list and file dir).
workflows:
  enabled: true
  tick_seconds: 5                 # scheduler period: cron, file polls, resume, queued runs
  max_concurrent_runs: 8          # runs executing at once in this worker
  default_concurrency: 4          # runs of one workflow at once (all workers); a definition's "concurrency" overrides
  max_parallel_steps: 4           # steps of one run at once; a definition's "max_parallel" overrides
  step_timeout_seconds: 300       # a step that sets no timeout_seconds
  loop_max_items: 100             # foreach cap when the step sets no max_items
  loop_hard_max_items: 10000      # foreach cap no step can exceed
  inline_wait_seconds: 5          # longer waits park the run and free the worker
  heartbeat_seconds: 5
  stale_seconds: 60               # a running run whose heartbeat is older is resumed elsewhere
  step_output_max_chars: 262144   # larger step outputs are stored as a truncated preview
  step_input_max_chars: 16384
  run_retention_days: 30          # finished runs older than this are deleted (0 keeps all)

# ── Shell Execution (DISABLED BY DEFAULT) ────────────────────────────────────
# Sandboxed Python and Bash execution for AI agents.
# SECURITY: Disabled by default. Enable only in trusted environments.

shell:
  enabled: ${SHELL_ENABLED:false}           # Master switch — DISABLED by default
  mode: sandbox                              # sandbox | unrestricted (admin-only)
  scratch_dir: data/shell_scratch            # Working directory for scripts
  python:
    enabled: true                            # Python sandbox (when shell.enabled=true)
    timeout_seconds: 30                      # Max execution time
    memory_limit_mb: 256                     # Max memory per execution
    # Allowed imports: json, math, csv, statistics, re, datetime, collections,
    #   itertools, functools, decimal, pandas, numpy
    # Blocked: os, sys, subprocess, socket, http, requests, ctypes, pickle
  bash:
    enabled: false                           # Bash sandbox — extra opt-in required
    timeout_seconds: 15
    max_output_bytes: 1048576                # 1 MB output cap
    # Allowed commands: cat, grep, awk, sed, sort, uniq, wc, jq, head, tail,
    #   ls, find, echo, date, base64, md5sum
    # Blocked: rm, chmod, sudo, ssh, wget, python, docker, pipe-to-shell

# ── Sandbox for user code ────────────────────────────────────────────────────
# Studio Python code tools, Studio script tools and the shell above run in a
# sandbox, never in the server process. Built-in tools stay in-process.
# Design and per-backend guarantees: docs/architecture/Sandbox.md
sandbox:
  default_backend: subprocess        # subprocess | bwrap | nsjail | docker | auto (bwrap > nsjail > subprocess)
  enforce_for_generated_tools: true  # false: Studio tools load in-process unless their config says sandbox.enabled: true
  strict: false                      # true: refuse to run if the backend or a confinement step is unavailable
  work_dir: ''                       # parent of the per-call temp dirs ('' = system temp)
  python: ''                         # interpreter for subprocess/bwrap/nsjail ('' = the server's own)
  extra_read_paths: []               # more read-only paths for the sandbox (e.g. a shared data dir)
  secrets_allowlist: []              # env var names a tool may request with sandbox.secrets (never SAJHA_*)
  defaults:                          # what a tool gets when its "sandbox" block leaves a key out
    timeout_seconds: 30
    cpu_seconds: 30
    memory_mb: 512
    max_output_bytes: 1048576
    max_processes: 64
    max_file_mb: 64
    network: none                    # none | allowlist
  max:                               # caps on what a tool's "sandbox" block may ask for
    timeout_seconds: 300
    cpu_seconds: 300
    memory_mb: 4096
    max_output_bytes: 16777216
    max_processes: 512
    max_file_mb: 1024
  docker:
    binary: docker                   # or podman
    image: python:3.13-slim          # must already be pulled
    runtime: ''                      # e.g. runsc (gVisor)
    cpus: 1

# ── Python Playground (/playground) ──────────────────────────────────────────
# Python runs in the visitor's browser (Pyodide, WebAssembly, in a Web Worker); nothing
# executes on the server. Guide: docs/getting-started/Python Playground.md
playground:
  enabled: true                    # false: /playground answers 404 and leaves the menus
  assets: vendored                 # vendored: /static/vendor/pyodide/<version>/ (run scripts/fetch_pyodide.py)
                                   # cdn: https://cdn.jsdelivr.net/pyodide/v<version>/full/ (CSP allows it on /playground only)
  pyodide_version: 314.0.7         # the release scripts/fetch_pyodide.py vendors
  allow_pypi: true                 # micropip may fetch pure-Python wheels from PyPI (playground worker only)

# ── Federation: other MCP servers' tools behind SAJHA's governance ───────────
# Off by default. Every key: docs/getting-started/Configuration Reference.md#federation;
# design and operation: docs/architecture/Federation.md
federation:
  enabled: false                   # master switch (SAJHA_FEDERATION_ENABLED)
  require_approval: true           # newly discovered upstream tools wait for an administrator
  allow_stdio: false               # stdio upstreams run as subprocesses of SAJHA: admin-only risk
  allow_localhost: false           # SSRF guard: allow loopback upstream URLs
  allow_private_networks: false    # SSRF guard: allow RFC 1918 / ULA upstream URLs
  allowed_hosts: []                # fnmatch host patterns; empty = any host the guard allows
  refresh_interval_seconds: 300    # periodic re-discovery and health check
  startup_wait_seconds: 5          # start-up waits at most this long for first discovery
  default_timeout_seconds: 30      # one upstream call's deadline (per-upstream timeout_seconds)
  max_description_chars: 1024      # cap on upstream descriptions (untrusted text)
  state_path: config/federation/federation.json   # upstreams added on /admin/federation + approvals
  upstreams: []                    # e.g. - {id: units, url: "http://127.0.0.1:8765/mcp"}
  # proxied MCP servers in the mcpServers JSON (Claude Desktop / Cursor / VS Code shape); git-ignored, may hold
  # credentials; templates: config/mcp_servers.json.example and config/mcp_servers/ (external unless "external": false)
  mcp_servers_file: config/mcp_servers.json
  mcp_servers_reload_seconds: 5    # checks the file's mtime and size; a change applies without a restart

# ── API Import: OpenAPI / Swagger / GraphQL → tools (Studio → Import an API) ──
# Every key: docs/getting-started/Configuration Reference.md#api-import; design:
# docs/architecture/API Import.md. Credentials are secret references (env:NAME), never values.
api_import:
  allow_localhost: false           # SSRF guard: allow loopback spec, $ref, server and token URLs
  allow_private_networks: false    # SSRF guard: allow RFC 1918 / ULA addresses (never link-local)
  allowed_hosts: []                # fnmatch host patterns; empty = any host the guard allows
  max_tools: 200                   # tools one imported API may have
  max_spec_bytes: 10485760         # largest spec (or introspection result) read
  max_ref_documents: 20            # remote documents one spec's $refs may pull in
  timeout_seconds: 30              # one call's deadline (per-import override on the page)
  max_response_bytes: 5242880      # largest API answer read
  graphql_depth: 2                 # selection-set depth generated for GraphQL tools (1-5)
  records_dir: config/api_imports  # import records (storage backend)

# ── Data connectors: databases, warehouses, vector stores as governed read-only tools ──
# Every key: docs/getting-started/Configuration Reference.md#data-connectors; design:
# docs/architecture/Data Connectors.md. Connections live in config/connectors/<id>.json
# (the /admin/connectors page writes them) with secret references only, never values.
connectors:
  enabled: true
  records_dir: config/connectors   # connection records (storage backend)
  default_max_rows: 500            # a connection's limits default to these ...
  max_rows_limit: 10000            # ... and are capped by these
  default_max_bytes: 2097152
  max_bytes_limit: 16777216
  default_timeout_seconds: 30
  max_timeout_seconds: 300
  sample_rows: 3                   # sample rows describe_table shows
  catalog_ttl_seconds: 600         # per-process schema catalog cache
  catalog_max_tables: 2000
  pool_size: 4                     # idle connections kept per connection
  pool_max_age_seconds: 300
  record_refresh_seconds: 5
  require_sqlglot: false           # true: refuse caller SQL without the sqlglot parser
  audit_sql: false                 # true: SQL text in audit records (else its SHA-256)
  sync_on_startup: true

# ── Connected accounts: users link GitHub, Slack, Google, ... once; tools act as them ──
# Every key: docs/getting-started/Configuration Reference.md#connected-accounts; design:
# docs/architecture/Connected Accounts.md. Secrets never go here: the vault key comes from
# SAJHA_ACCOUNTS_VAULT_KEY (or is generated into the server secrets file) and each client
# secret is a reference (client_secret_ref: env:NAME).
accounts:
  enabled: true                    # master switch (SAJHA_ACCOUNTS_ENABLED)
  public_url: ""                   # origin in redirect and connect URLs; empty: mcp.auth.public_url, else the request
  flow_ttl_seconds: 600            # how long a started "Connect" may take
  refresh_skew_seconds: 120        # refresh an access token this long before it expires
  http_timeout_seconds: 20         # token endpoint and provider API calls
  max_response_bytes: 2000000      # cap on one provider API response
  vault:
    key: ""                        # SAJHA_ACCOUNTS_VAULT_KEY; empty: generated once into the secrets file
    previous_keys: []              # old keys, still readable during a rotation
    key_provider: ""               # package.module:factory (a KMS hook), instead of key
  # A built-in provider (github, slack, google, microsoft, atlassian, notion) is enabled by a
  # client id; any field can be overridden, and a new id with every endpoint is a custom one.
  providers: {}
  #  github:
  #    client_id: ${GITHUB_OAUTH_CLIENT_ID:}
  #    client_secret_ref: env:GITHUB_OAUTH_CLIENT_SECRET

# ── Observability: Prometheus /metrics, OpenTelemetry, usage ledger, alerts ──
# Every key: docs/getting-started/Configuration Reference.md#observability;
# design: docs/architecture/Observability.md. Secrets (the metrics token, OTLP headers,
# the SMTP password) come from the environment, never this file.
observability:
  metrics:
    enabled: true                  # /metrics and the in-process metric families
    auth: admin                    # none | token (SAJHA_OBSERVABILITY_METRICS_TOKEN) | admin
    port: 0                        # > 0: also serve /metrics on a separate listener
    host: 0.0.0.0                  # that listener's bind address (all interfaces, like the server)
    tool_label: name               # name | group | none: the tool label's cardinality
    max_series: 2000               # label sets per family; beyond it values fold into _other
    multiworker: auto              # auto: merge workers' snapshots via a shared state store | off
    publish_interval_seconds: 15   # snapshot interval with several workers
  otel:
    enabled: false                 # OTLP export (needs opentelemetry-sdk + an OTLP exporter)
    endpoint: ''                   # e.g. http://otel-collector:4318 (OTEL_EXPORTER_OTLP_ENDPOINT wins)
    protocol: http/protobuf        # http/protobuf | grpc
    service_name: sajha-mcp-server # OTEL_SERVICE_NAME wins
    sample_ratio: 1.0              # parent-based ratio sampler
    traces: true
    metrics: true
  usage:
    enabled: true                  # the usage ledger behind /monitoring/usage
    retention_days: 90             # rows older than this are deleted daily (0 = keep)
    queue_size: 10000              # rows waiting to be written; beyond it rows are dropped
    max_rows_for_percentiles: 200000
  alerts_interval_seconds: 30      # how often in-process alert rules are evaluated
  alerts_webhook:
    allowed_urls: []               # URL prefixes alert webhooks may post to
    allow_private_networks: false  # SSRF guard: allow loopback / RFC 1918 webhook hosts
  alerts: []                       # rules: see docs/architecture/Observability.md#5-alerts
  alerts_email:                    # the email channel (password: SAJHA_OBSERVABILITY_ALERTS_EMAIL_PASSWORD)
    smtp_host: ''
    smtp_port: 587
    from: sajha@localhost
    starttls: true
    username: ''

# ── System notices: what needs attention, shown in the console ──
# A banner on every page, a System status panel on the dashboard, a navbar badge.
# Every key: docs/getting-started/Configuration Reference.md#system-notices;
# design: docs/architecture/System Notices.md.
notices:
  enabled: true
  max_active: 500                  # open notices kept at most (the oldest, lowest-severity one goes first)
  default_ttl_minutes: 30          # a notice not refreshed for this long is cleared (0 = never)
  banner_min_severity: error       # error | critical: what takes the banner
  cleared_retention_minutes: 1440  # how long cleared notices stay under "Show recently cleared"
  check_interval_seconds: 30       # how often polled sources (breakers, LLM, federation) are re-checked
  workflow_failures: 3             # scheduled runs failing in a row before a workflow raises a notice
  forward: []                      # also send notices through alert channels, e.g.
  #  - { min_severity: critical, channel: { type: webhook, url: "https://hooks.example.com/sajha" } }

# ── Policy engine: rules evaluated before every tool call, on every path ──
# Rules live in policy.dir (storage backend, hot-reloaded); the shipped file has none, so
# nothing changes by default. Every key: docs/getting-started/Configuration Reference.md#policy-and-audit;
# design: docs/architecture/Policy and Audit.md.
policy:
  enabled: true                    # false: no rule is evaluated
  dir: config/policies             # *.yaml | *.yml | *.json, read through the storage backend
  reload_seconds: 5                # recheck the directory at most this often (on the next call)
  default_effect: allow            # allow | deny (deny: only calls a rule explicitly allows run)
  on_error: ignore                 # a broken policy file: ignore (not enforced) | deny (every call fails closed)
  fail_closed: true                # an error inside evaluation denies the call
  audit_allow: false               # also audit plain allows (one record per call)
  audit_arguments: false           # put argument values (not only names) in policy audit records
  approvals:
    ttl_seconds: 86400             # how long a pending approval waits
    grant_ttl_seconds: 3600        # how long an approval may be used (once) after it is granted
    allow_self_approval: false     # may an administrator approve their own call
    notify_url: ''                 # announce new approvals (must be in observability.alerts_webhook.allowed_urls)
    notify_format: generic         # generic | slack

# ── Tamper-evident audit: hash chain, signed anchors, SIEM export ──
audit:
  chain:
    enabled: true                  # store the hash chain (audit_chain, audit_anchors)
    anchor_every: 100              # sign the chain head every N records
    anchor_interval_seconds: 300   # ... and at least this often while records arrive (0: off)
    flush_interval_ms: 200         # deferred records (tool calls) are stored this often ...
    flush_batch: 200               # ... or as soon as this many are waiting
  # Every tool call is a tool.call record: docs/architecture/Policy and Audit.md#13-tool-calls-in-the-audit-chain
  tool_calls:
    enabled: true                  # false: no tool.call records at all
    success_sample_rate: 1.0       # share of successful calls recorded (failures, denials, destructive: always)
    sample_rates: []               # per tool, first match wins: ["fred_*=0.1", "calc_*=0"]
    include_tools: []              # globs; empty: every tool (successes only; failures always recorded)
    exclude_tools: []              # globs whose successful calls are not recorded
    arguments: hash                # hash (SHA-256, no values) | redacted | none
    max_argument_bytes: 4096       # cap on redacted arguments
  export:
    allowed_urls: []               # URL prefixes HTTP sinks may post to (empty: any public host)
    sinks: []                      # syslog | http | file sinks: see docs/architecture/Policy and Audit.md#8-siem-export

# ── Snapshots of users, API keys and tools (signed, chained; works without SAJHA Net) ──
# docs/architecture/Policy and Audit.md (Snapshots); python -m sajha.snapshots verify|diff|restore
snapshots:
  enabled: true
  interval_minutes: 10             # one snapshot per interval, written by one worker (state-store lease)
  keep: 20                         # the oldest beyond this are deleted (audited)
  dir: data/snapshots              # owner-only (0700 / files 0600); git-ignored
  compress: false                  # gzip (.json.gz)

# ── Tool quality: test harness, linter, health probes, evals, tool versions ──
# Nothing runs by default: probes are off and no tool has a versions file. Every key:
# docs/getting-started/Configuration Reference.md#quality; design: docs/architecture/Tool Quality.md.
quality:
  tests_dir: config/tool_tests     # test cases (*.yaml|*.yml|*.json); tool configs may also carry "tests"
  cassettes_dir: config/tool_tests/cassettes   # recorded HTTP fixtures, <tool>/<case>.json
  evals_dir: config/evals          # Ask SAJHA eval sets
  versions_dir: config/tool_versions   # <tool>.yaml: versions, canary routing, rollback, deprecation
  lint:
    min_description: 40            # shorter tool descriptions are a warning
  probes:
    enabled: false                 # true: run the probe: blocks of test files on their schedule
    tick_seconds: 15               # how often the scheduler looks for due probes
    default_every_seconds: 300     # a probe with neither every nor cron
    history: 20                    # results kept per tool (state store)
  versions:
    enabled: true                  # false: versions files are ignored (every call runs the registered tool)
    reload_seconds: 5              # recheck versions_dir at most this often

# ── SAJHA Net: servers joined into nets (off by default) ─────────────────────
# Membership, names, the CA and signed requests on this port. Every key:
# docs/getting-started/Configuration Reference.md#sajha-net; design: docs/architecture/SAJHA Net.md;
# wire protocol: docs/protocol/SAJHA Net Protocol.md. Keys and certificates are files (secret
# references), never values here.
sajhanet:
  enabled: false
  # Test admin: records marked "test_admin" in config/apikeys.json and config/users.json sign in as an
  # administrator, and SAJHA Net calls between servers carry the test admin key, while this is on.
  # Development and testing only: a critical notice shows on every page while it is active.
  # A net with no seeds (a net of one) creates its CA at first start, so peers can enroll without
  # running `sajha net ca init` first; a warning notice asks to back up the CA key. Per net: ca.auto_init.
  ca_auto_init: true
  test_admin_key:
    enabled: true
  # API keys this server uses toward particular members (local to this server; never shared):
  # "<net>/<instance>" or "<instance>" -> the key that member issued; a ${ENV_NAME} reference works.
  # When a member has one, calls to it carry that key instead of the caller's (or the test admin) key.
  peer_keys:
    # Sample (testing): calls to the member "peer-b" in the net "default" carry this key. It works only if
    # peer-b's own config/apikeys.json has a record with the same "key" (see config/apikeys.json.example).
    default/peer-b: sja_peer_b_sample_key_0001
  nets: []                         # one entry per net, in preference order; an entry looks like:
  #  - name: acme-net               # omitted: the net is called `default`
  #    instance_name: risk-eu       # unset: this server's address, <ip>:<port>
  #    advertise_address: ""        # ip:port peers should use (NAT, containers)
  #    founder: false               # true: start alone when every seed is down (the net's first server)
  #    seeds: [https://sajha-treasury-na.example.internal]   # none: a net of one (this server its founder)
  #    identity: {cert_ref: file:data/sajhanet/acme-net/instance.crt, key_ref: file:data/sajhanet/acme-net/instance.key,
  #               ca_ref: file:data/sajhanet/acme-net/ca.pem, revocation_list_ref: file:data/sajhanet/acme-net/revoked.json}
  #    ca: {enabled: false, key_ref: file:data/sajhanet/acme-net/ca.key, cert_validity_days: 30, enrollment_token_minutes: 30}
  base_url: ""                     # https URL peers reach this server on (required with a configured instance_name)
  region: ""
  signature_max_age_seconds: 30    # a signed request older than this is refused (at most 300)
  require_https: true              # false only for a lab: enrollment and peer URLs may then be plain HTTP
  min_protocol_version: 1
  data_dir: data/sajhanet          # default home of each net's keys, certificates and peers.json (git-ignored)
  max_injections_per_minute: 6     # peers an administrator may add by address, per net
  agent_lease_seconds: 15          # the gossip agent's state-store lease (one agent per net across workers)
  plugins:
    membership: gossip             # gossip | static (static_peers in a net entry) | package.module:Class
    admission: open                # open (no CA: self-signed, accepted on first use, then held to the name;
                                   # owner decision, for now) | builtin_ca (the net's CA) | manual (pinned)
    connector: sajha_native
    key_directory_store: database  # database (sajhanet_api_keys) | memory | package.module:Class
    routing: local_first           # order of the hosts of one tool within a net: local_first | lowest_latency | pinned
    modules: []                    # third-party plug-in modules loaded at start (each contract-checked; failures are
                                   # notices), e.g. [sajha.examples.sajhanet.region_first]; entry points load too
  # catalogs and routing (docs/architecture/SAJHA Net.md §7-§9)
  preferences: {}                  # per tool: ["<net>/<instance>", "<net>", ...] tried before the nets in order
  max_fallbacks: 3                 # other hosts tried after the first, for a call by plain name (§9.1)
  bare_aliases: "on"               # on | preferences_only | off: plain names for remote tools
  default_trust: auto              # auto | review | pinned for peers' tools (a net entry may override)
  refresh_interval_seconds: 300    # re-pull a peer's catalog at least this often, even with no new digest
  default_timeout_seconds: 30      # one forwarded call, and the shared deadline of its fallbacks
  max_hops: 1                      # forwarded calls accepted at most this many hops from their home (at most 8)
  max_call_chain: 8                # one budget for a whole call chain: hops plus tools nested in one another on every
                                   # instance passed (planners' tools, LLM tools, composites); at most 32 (§14)
  allow_remote_llm_tools: true     # export LLM tools like plain tools; they run on this server's models and budgets
  reexport: false                  # offer tools imported from other members onward (§14); a net entry may override,
                                   # and it is the net offered into that decides (a bridge between nets)
  reexport_rules: []               # with reexport on, only what a rule names goes onward: [{tools: [..],
                                   # from_nets: [..], from_instances: [..], to_instances: [..], for_roles: [..]}]
  limits:
    max_tools_per_peer: 2000
    max_catalog_bytes: 5242880
    max_description_chars: 1024
  peer:                            # per-peer isolation at the home
    breaker_threshold: 5           # consecutive availability failures before calls to the peer pause
    breaker_reset_seconds: 30
    calls_per_minute: 600          # this home's calls to one peer
    inbound_calls_per_minute: 600  # forwarded calls accepted from one peer
  streaming:                       # signed event streams on forwarded calls (progress, log, cancellation; §15.10)
    enabled: true                  # lists the features streaming, progress and cancellation; false: JSON answers only
    max_events: 1000               # events per stream, the final answer excluded
    max_event_bytes: 65536         # one event
    max_stream_bytes: 8388608      # one whole stream
    idle_timeout_seconds: 30       # home: no event or heartbeat for this long ends the stream (the call is cancelled)
    heartbeat_seconds: 10          # host: a heartbeat this often while nothing else is sent (below the idle timeout)
    progress_min_interval_ms: 100  # host: progress coalesced to one event per interval (the last kept)
  # identity and authorization (docs/architecture/SAJHA Net.md §10-§11)
  user_identity: api_key           # api_key (the user's own key travels, verified by the host) | assertion (a
                                   # user assertion signed by the home; only a key id crosses) | token_exchange
                                   # (an assertion exchanged at the host for a host-scoped token) | none; a list
                                   # (comma separated): the first the host also lists is sent, all are accepted.
                                   # A net entry may set its own.
  assertion:
    ttl_seconds: 30                # lifetime of a user assertion (at most 60)
  token_exchange:
    ttl_seconds: 300               # lifetime of a token this server issues as a host (at most 3600)
  key_directory:
    sync: true                     # pull other members' key records (sajhanet_api_keys)
    full_sync_interval_seconds: 300   # compare key digests and repair differences
  users:
    match_by_name: true            # a remote user runs as the local account with the same login name
    unknown: refuse                # refuse | map_roles (guest identity with role_maps)
    remote_admin: admin            # admin | user | refuse: remote administrators calling tools here
  role_maps: {}                    # {instance: {remote role: [local roles]}}, for unknown: map_roles
  service_calls: false             # accept forwarded calls that carry no user
  anonymous_may_call_remote: false
  residency:                       # data classes and residency rules on forwarded calls (SAJHA Net §12)
    enabled: true
    default_effect: allow          # deny: classified data crosses only when a residency rule allows it
  data_classes:
    tools: {}                      # {<tool or glob>: {arguments: {<path>: <class>}, results: {<path>: <class>}}}
  memory:
    remote_results: store          # store | summary | none: what memory keeps of answers using remote results
    by_class: {}                   # {<class or glob>: store | summary | none}; the strictest wins
  # a net entry may also set export: and import: rules (see the Configuration Reference)
  # plain MCP servers (federation upstreams) this server sponsors into a net, each a participant of kind
  # sponsored under its own instance name; also added in the admin API (/api/sajhanet/sponsored)
  # (vendor required; rename: {upstream tool: published name}; a sponsored server is a member, never external)
  sponsored: []                    # [{net: acme-net, instance_name: vendor-search, upstream: vendor, vendor: acme,
                                   #   tools: ["*"]}]
  # vendors and external servers (SAJHA Net §5.6); a net entry may override vendor and rename
  vendor: sajha                    # the organisation that answers for this server's tools (in the member record)
  rename: {}                       # {local tool: published name}: a deliberate short name, same contract rule
  # federation upstreams offered into the nets as external servers (never members), tools as <prefix>__<tool>;
  # the mcpServers file's entries (federation.mcp_servers_file) are external servers without an entry here
  external_servers: []             # [{upstream: acme, vendor: acme, prefix: acme, tools: ["*"], rename: {}, nets: []}]
  peer_cache:
    interval_minutes: 10           # the saved peer list is written on change and at least this often
    max_age_days: 7                # saved peers not seen for longer are skipped on restart
  gossip:
    gossip_interval_ms: 1000
    ping_timeout_ms: 500
    indirect_probes: 3
    suspect_timeout_seconds: 10
    full_sync_interval_seconds: 30
    dead_retention_minutes: 60
    dead_probe_interval_seconds: 30
